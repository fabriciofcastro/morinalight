name: CD Enhanced - Continuous Deployment

on:
  workflow_run:
    workflows: ["CI Enhanced - Multi-Stage Pipeline"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        type: choice
        options:
          - staging
          - production
      version:
        description: 'Version/tag to deploy'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  determine-environment:
    name: Determine Deployment Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      image-tag: ${{ steps.set-env.outputs.image-tag }}
      should-deploy: ${{ steps.set-env.outputs.should-deploy }}
    
    steps:
      - name: Set deployment parameters
        id: set-env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
            TAG="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            ENV="production"
            TAG="${{ github.ref_name }}"
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            ENV="staging"
            TAG="develop-${GITHUB_SHA::8}"
          else
            ENV=""
            TAG=""
          fi
          
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "image-tag=$TAG" >> $GITHUB_OUTPUT
          
          if [ -n "$ENV" ]; then
            echo "should-deploy=true" >> $GITHUB_OUTPUT
          else
            echo "should-deploy=false" >> $GITHUB_OUTPUT
          fi

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: determine-environment
    if: needs.determine-environment.outputs.environment == 'staging' && needs.determine-environment.outputs.should-deploy == 'true'
    environment:
      name: staging
      url: https://staging.morina.ai
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: deployment-manifests
          path: devops/deployments/

      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging environment..."
          echo "Image tag: ${{ needs.determine-environment.outputs.image-tag }}"
          # Add your deployment logic here
          # Example: kubectl apply, helm upgrade, etc.

      - name: Run smoke tests
        run: |
          echo "🧪 Running smoke tests..."
          ./deploy/strategies/smoke-tests.sh staging

      - name: Notify deployment
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          text: 'Deployment to staging completed'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: determine-environment
    if: needs.determine-environment.outputs.environment == 'production' && needs.determine-environment.outputs.should-deploy == 'true'
    environment:
      name: production
      url: https://morina.ai
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: deployment-manifests
          path: devops/deployments/

      - name: Blue-Green Deployment
        run: |
          echo "🔄 Starting blue-green deployment to production..."
          ./deploy/strategies/blue-green-deploy.sh production

      - name: Run comprehensive tests
        run: |
          echo "✅ Running post-deployment tests..."
          ./deploy/strategies/smoke-tests.sh production

      - name: Monitor deployment
        run: |
          echo "👀 Monitoring deployment health..."
          ./deploy/monitor.sh production
        continue-on-error: true

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false

      - name: Notify deployment
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          text: 'Deployment to production completed'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true

  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: failure()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rollback
        run: |
          echo "⏪ Rolling back deployment..."
          ./deploy/rollback.sh ${{ needs.determine-environment.outputs.environment }}

      - name: Notify rollback
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Rollback executed due to deployment failure'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        continue-on-error: true












