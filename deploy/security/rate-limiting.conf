# Rate Limiting Configuration
# Previne abuso e ataques DDoS

# Rate limiting para API
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_auth_limit:10m rate=5r/s;  # Mais restritivo para auth

# Rate limiting para web
limit_req_zone $binary_remote_addr zone=web_limit:10m rate=30r/s;

# Rate limiting para login (proteção contra brute force)
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=3r/m;  # 3 tentativas por minuto

# Connection limiting (prevenir conexões simultâneas excessivas)
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
limit_conn conn_limit 20;

# Timeout para requests lentos (Slowloris protection)
client_body_timeout 10s;
client_header_timeout 10s;
keepalive_timeout 65s;
send_timeout 10s;


