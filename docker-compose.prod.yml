services:
  # PostgreSQL Master
  postgres-master:
    image: postgres:16-alpine
    container_name: morina-postgres-master
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-morina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-morina}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER:-replicator}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
    volumes:
      - postgres-master-data:/var/lib/postgresql/data
      - ./deploy/postgres/master-init.sh:/docker-entrypoint-initdb.d/init-replication.sh
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=3
      -c max_replication_slots=3
      -c hot_standby=on
      -c hot_standby_feedback=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-morina}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - morina-network

  # PostgreSQL Replica (Slave)
  postgres-replica:
    image: postgres:16-alpine
    container_name: morina-postgres-replica
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-morina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-morina}
      PGUSER: ${POSTGRES_USER:-morina}
    volumes:
      - postgres-replica-data:/var/lib/postgresql/data
      - ./deploy/postgres/replica-init.sh:/docker-entrypoint-initdb.d/init-replica.sh
    depends_on:
      postgres-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-morina}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - morina-network

  # Redis Master
  redis-master:
    image: redis:7-alpine
    container_name: morina-redis-master
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-master-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - morina-network

  # Redis Replica
  redis-replica:
    image: redis:7-alpine
    container_name: morina-redis-replica
    restart: unless-stopped
    command: >
      sh -c "redis-server 
      --slaveof redis-master 6379 
      --masterauth ${REDIS_PASSWORD}
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes"
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - morina-network

  # API Server 1
  api-1:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: morina-api-1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-morina}:${POSTGRES_PASSWORD}@postgres-master:5432/${POSTGRES_DB:-morina}
      DATABASE_REPLICA_URL: postgresql://${POSTGRES_USER:-morina}:${POSTGRES_PASSWORD}@postgres-replica:5432/${POSTGRES_DB:-morina}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-master:6379
      REDIS_REPLICA_URL: redis://:${REDIS_PASSWORD}@redis-replica:6379
      JWT_SECRET: ${JWT_SECRET}
      REALTIME_SECRET: ${REALTIME_SECRET}
      API_HOST: 0.0.0.0
      API_PORT: 3333
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres-master:
        condition: service_healthy
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3333/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - morina-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.morina.local`)"
      - "traefik.http.services.api.loadbalancer.server.port=3333"

  # API Server 2
  api-2:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: morina-api-2
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-morina}:${POSTGRES_PASSWORD}@postgres-master:5432/${POSTGRES_DB:-morina}
      DATABASE_REPLICA_URL: postgresql://${POSTGRES_USER:-morina}:${POSTGRES_PASSWORD}@postgres-replica:5432/${POSTGRES_DB:-morina}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-master:6379
      REDIS_REPLICA_URL: redis://:${REDIS_PASSWORD}@redis-replica:6379
      JWT_SECRET: ${JWT_SECRET}
      REALTIME_SECRET: ${REALTIME_SECRET}
      API_HOST: 0.0.0.0
      API_PORT: 3333
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres-master:
        condition: service_healthy
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3333/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - morina-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`api.morina.local`)"
      - "traefik.http.services.api.loadbalancer.server.port=3333"

  # Realtime Server 1
  realtime-1:
    build:
      context: .
      dockerfile: apps/realtime/Dockerfile
    container_name: morina-realtime-1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REALTIME_PORT: 3334
      REALTIME_HOST: 0.0.0.0
      REALTIME_SECRET: ${REALTIME_SECRET}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-master:6379
      REDIS_REPLICA_URL: redis://:${REDIS_PASSWORD}@redis-replica:6379
      REALTIME_STREAM: realtime.catalogo
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3334/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - morina-network

  # Realtime Server 2
  realtime-2:
    build:
      context: .
      dockerfile: apps/realtime/Dockerfile
    container_name: morina-realtime-2
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REALTIME_PORT: 3334
      REALTIME_HOST: 0.0.0.0
      REALTIME_SECRET: ${REALTIME_SECRET}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-master:6379
      REDIS_REPLICA_URL: redis://:${REDIS_PASSWORD}@redis-replica:6379
      REALTIME_STREAM: realtime.catalogo
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3334/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - morina-network

  # Web Server 1
  web-1:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://nginx:80/api}
        NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL:-ws://nginx:80/realtime}
    container_name: morina-web-1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - morina-network

  # Web Server 2
  web-2:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://nginx:80/api}
        NEXT_PUBLIC_REALTIME_URL: ${NEXT_PUBLIC_REALTIME_URL:-ws://nginx:80/realtime}
    container_name: morina-web-2
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - morina-network

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: morina-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
      - ./deploy/security/security-headers.conf:/etc/nginx/conf.d/security-headers.conf:ro
      - ./deploy/security/rate-limiting.conf:/etc/nginx/conf.d/rate-limiting.conf:ro
    depends_on:
      - api-1
      - api-2
      - web-1
      - web-2
      - realtime-1
      - realtime-2
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - morina-network

volumes:
  postgres-master-data:
  postgres-replica-data:
  redis-master-data:

networks:
  morina-network:
    driver: bridge

